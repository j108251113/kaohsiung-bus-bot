name = "kaohsiung-bus-bot"
main = "src/index.ts"
compatibility_date = "2024-06-20"

# KV Namespace for user settings
# After running: npx wrangler kv namespace create "USER_SETTINGS"
# Replace the id below with the actual ID from the output
[[kv_namespaces]]
binding = "USER_SETTINGS"
id = "1ce69f61180949c584e1ec632a43ccc5"

# Environment variables (non-secret)
[vars]
# BOT_NAME is used in welcome messages
BOT_NAME = "高雄公車到站查詢"

# Secrets (set via: npx wrangler secret put TELEGRAM_BOT_TOKEN)
# TELEGRAM_BOT_TOKEN = "set via wrangler secret"
